<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Helper Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #19232d;
            --card-bg: #1e2d3b;
            --border-color: #2c3e50;
            --text-color: #ffffff;
            --hint-color: #8899a6;
            --accent-color: #3b82f6;
            --danger-color: #ff5252;
            --success-color: #4caf50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0 0 70px 0;
            box-sizing: border-box;
            user-select: none;
        }

        .container {
            padding: 16px;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Убираем стрелочки (спиннеры) в поле ввода типа number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .type-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .type-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background-color: #243447;
            color: #fff;
            opacity: 0.5;
            transition: 0.2s;
        }
        .type-btn.active.expense { background-color: var(--danger-color); opacity: 1; }
        .type-btn.active.income { background-color: var(--success-color); opacity: 1; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--hint-color); }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }
        .history-info { display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .history-cat { font-weight: bold; font-size: 15px; }
        .history-comm { font-size: 12px; color: var(--hint-color); }
        .history-right { display: flex; align-items: center; gap: 10px; }
        .history-amount { font-weight: bold; font-size: 15px; }
        .history-amount.expense { color: var(--danger-color); }
        .history-amount.income { color: var(--success-color); }
        .del-btn {
            background: none;
            border: none;
            color: var(--hint-color);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            display: flex;
            border-top: 1px solid var(--border-color);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--hint-color);
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-item.active { color: var(--accent-color); font-weight: bold; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ВКЛАДКА 1: ВВОД -->
        <div id="tab-add" class="tab-content active">
            <h3 style="text-align: center; margin-top: 0; color: var(--hint-color);">Добавить операцию</h3>
            <div class="type-switcher">
                <button type="button" class="type-btn active expense" id="btn-expense" onclick="setType('expense')">➖ Расход</button>
                <button type="button" class="type-btn income" id="btn-income" onclick="setType('income')">➕ Доход</button>
            </div>
            <div class="form-group">
                <label for="amount">Сумма (₽)</label>
                <input type="number" id="amount" placeholder="0.00" step="any" inputmode="decimal">
            </div>
            <div class="form-group">
                <label for="category">Категория</label>
                <select id="category"></select>
            </div>
            <div class="form-group">
                <label for="comment">Комментарий</label>
                <input type="text" id="comment" placeholder="Необязательно">
            </div>
            <button class="submit-btn" onclick="sendData()">Сохранить</button>
        </div>

        <!-- ВКЛАДКА 2: АНАЛИТИКА -->
        <div id="tab-stats" class="tab-content">
            <h3 style="text-align: center; margin-top: 0; color: var(--hint-color);">Аналитика</h3>
            <div class="card">
                <div style="font-size: 40px; margin-bottom: 10px;">🛠</div>
                <div style="font-weight: bold; font-size: 18px; margin-bottom: 6px;">Раздел в разработке</div>
                <div style="color: var(--hint-color); font-size: 14px;">Здесь появятся графики, диаграммы и ИИ-анализ ваших трат.</div>
            </div>
        </div>

        <!-- ВКЛАДКА 3: ИСТОРИЯ -->
        <div id="tab-history" class="tab-content">
            <h3 style="text-align: center; margin-top: 0; color: var(--hint-color);">История операций</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('add', this)">
            <div class="nav-icon">➕</div>
            <div>Ввод</div>
        </div>
        <div class="nav-item" onclick="switchTab('stats', this)">
            <div class="nav-icon">📊</div>
            <div>Аналитика</div>
        </div>
        <div class="nav-item" onclick="switchTab('history', this)">
            <div class="nav-icon">📜</div>
            <div>История</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentType = 'expense';
        const expCategories = ["Продукты", "Транспорт", "Развлечения", "ЖКХ и Дом", "Здоровье", "Другое"];
        const incCategories = ["Зарплата", "Фриланс", "Кэшбэк", "Другое"];

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            el.classList.add('active');

            if (tabName === 'history') loadHistory();
        }

        function setType(type) {
            currentType = type;
            document.getElementById('btn-expense').className = 'type-btn expense' + (type === 'expense' ? ' active' : '');
            document.getElementById('btn-income').className = 'type-btn income' + (type === 'income' ? ' active' : '');
            updateCategories();
        }

        function updateCategories() {
            const select = document.getElementById('category');
            select.innerHTML = '';
            const cats = currentType === 'expense' ? expCategories : incCategories;
            cats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function getLocalHistory() {
            try {
                return JSON.parse(localStorage.getItem('coin_history') || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveLocalHistory(history) {
            localStorage.setItem('coin_history', JSON.stringify(history));
        }

        function sendData() {
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const comment = document.getElementById('comment').value.trim();

            if (!amount || amount <= 0) {
                tg.showAlert('Пожалуйста, введите корректную сумму.');
                return;
            }

            const item = {
                id: Date.now(),
                type: currentType,
                amount: amount,
                category: category,
                comment: comment,
                date: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            };

            const history = getLocalHistory();
            history.push(item);
            saveLocalHistory(history);

            tg.sendData(JSON.stringify({ type: currentType, amount, category, comment }));
            tg.close();
        }

        function loadHistory() {
            const list = document.getElementById('history-list');
            const history = getLocalHistory();

            if (!history.length) {
                list.innerHTML = '<div style="text-align:center; color: var(--hint-color); padding: 20px;">История пока пуста</div>';
                return;
            }

            list.innerHTML = '';
            history.slice().reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                const sign = item.type === 'expense' ? '-' : '+';
                const cls = item.type === 'expense' ? 'expense' : 'income';

                div.innerHTML = `
                    <div class="history-info">
                        <div class="history-cat">${item.category}</div>
                        <div class="history-comm">${item.comment || item.date}</div>
                    </div>
                    <div class="history-right">
                        <div class="history-amount ${cls}">${sign}${item.amount} ₽</div>
                        <button class="del-btn" onclick="deleteItem(${item.id})">🗑</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function deleteItem(id) {
            let history = getLocalHistory();
            history = history.filter(item => item.id !== id);
            saveLocalHistory(history);
            loadHistory();
        }

        updateCategories();
    </script>
</body>
</html>
