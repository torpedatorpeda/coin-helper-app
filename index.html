<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Helper Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #19232d;
            --card-bg: #1e2d3b;
            --border-color: #2c3e50;
            --text-color: #ffffff;
            --hint-color: #8899a6;
            --accent-color: #3b82f6;
            --danger-color: #ff5252;
            --success-color: #4caf50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0 0 70px 0;
            box-sizing: border-box;
            user-select: none;
        }

        .container {
            padding: 16px;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Переключатель Доход/Расход */
        .type-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .type-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background-color: #243447;
            color: #fff;
            opacity: 0.5;
            transition: 0.2s;
        }
        .type-btn.active.expense { background-color: var(--danger-color); opacity: 1; }
        .type-btn.active.income { background-color: var(--success-color); opacity: 1; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--hint-color); }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Карточки и Сетка */
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        /* Элементы истории */
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }
        .history-info { display: flex; flex-direction: column; gap: 4px; }
        .history-cat { font-weight: bold; font-size: 15px; }
        .history-comm { font-size: 12px; color: var(--hint-color); }
        .history-right { display: flex; align-items: center; gap: 10px; }
        .history-amount { font-weight: bold; font-size: 15px; }
        .history-amount.expense { color: var(--danger-color); }
        .history-amount.income { color: var(--success-color); }
        .del-btn {
            background: none;
            border: none;
            color: var(--hint-color);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        /* Нижнее меню навигации */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            display: flex;
            border-top: 1px solid var(--border-color);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--hint-color);
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-item.active { color: var(--accent-color); font-weight: bold; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ВКЛАДКА 1: ВВОД -->
        <div id="tab-add" class="tab-content active">
            <h3 style="text-align: center; margin-top: 0; color: var(--hint-color);">Добавить операцию</h3>
            <div class="type-switcher">
                <button type="button" class="type-btn active expense" id="btn-expense" onclick="setType('expense')">➖ Расход</button>
                <button type="button" class="type-btn income" id="btn-income" onclick="setType('income')">➕ Доход</button>
            </div>
            <div class="form-group">
                <label for="amount">Сумма (₽)</label>
                <input type="number" id="amount" placeholder="0.00" step="any" inputmode="decimal">
            </div>
            <div class="form-group">
                <label for="category">Категория</label>
                <select id="category"></select>
            </div>
            <div class="form-group">
                <label for="comment">Комментарий</label>
                <input type="text" id="comment" placeholder="Необязательно">
            </div>
            <button class="submit-btn" onclick="sendData()">Сохранить</button>
        </div>

        <!-- ВКЛАДКА 2: СТАТИСТИКА -->
        <div id="tab-stats" class="tab-content">
            <h3 style="text-align: center; margin-top: 0; color: var(--hint-color);">Аналитика расходов</h3>
            <div class="card">
                <canvas id="expenseChart" style="max-height: 250px;"></canvas>
            </div>
            <div id="stats-summary" class="card"></div>
        </div>

        <!-- ВКЛАДКА 3: ИСТОРИЯ -->
        <div id="tab-history" class="tab-content">
            <h3 style="text-align: center; margin-top: 0; color: var(--hint-color);">История операций</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('add', this)">
            <div class="nav-icon">➕</div>
            <div>Ввод</div>
        </div>
        <div class="nav-item" onclick="switchTab('stats', this)">
            <div class="nav-icon">📊</div>
            <div>Аналитика</div>
        </div>
        <div class="nav-item" onclick="switchTab('history', this)">
            <div class="nav-icon">📜</div>
            <div>История</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentType = 'expense';
        let chartInstance = null;
        let categories = { expense: [], income: [] };

        // Инициализация API адреса бэкенда (берётся из URL бота или хоста)
        const API_BASE = window.location.origin;

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            el.classList.add('active');

            if (tabName === 'stats') loadStats();
            if (tabName === 'history') loadHistory();
        }

        function setType(type) {
            currentType = type;
            document.getElementById('btn-expense').className = 'type-btn expense' + (type === 'expense' ? ' active' : '');
            document.getElementById('btn-income').className = 'type-btn income' + (type === 'income' ? ' active' : '');
            updateCategoryDropdown();
        }

        function updateCategoryDropdown() {
            const select = document.getElementById('category');
            select.innerHTML = '';
            const cats = currentType === 'expense' ? categories.expense : categories.income;
            cats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        async function loadCategories() {
            try {
                const res = await fetch(`/api/categories?initData=${encodeURIComponent(tg.initData)}`);
                const data = await res.json();
                categories.expense = data.expense;
                categories.income = ["Зарплата", "Фриланс", "Кэшбэк", "Другое"];
                updateCategoryDropdown();
            } catch (e) {
                categories.expense = ["Продукты", "Транспорт", "Развлечения", "ЖКХ и Дом", "Здоровье"];
                categories.income = ["Зарплата", "Фриланс", "Кэшбэк"];
                updateCategoryDropdown();
            }
        }

        function sendData() {
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const comment = document.getElementById('comment').value.trim();

            if (!amount || amount <= 0) {
                tg.showAlert('Введите корректную сумму');
                return;
            }

            const payload = { type: currentType, amount, category, comment };
            tg.sendData(JSON.stringify(payload));
            tg.close();
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = 'Загрузка...';
            try {
                const res = await fetch(`/api/history?initData=${encodeURIComponent(tg.initData)}`);
                const history = await res.json();
                
                if (!history.length) {
                    list.innerHTML = '<div style="text-align:center; color: var(--hint-color);">История пуста</div>';
                    return;
                }

                list.innerHTML = '';
                history.reverse().forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    const sign = item.type === 'expense' ? '-' : '+';
                    const cls = item.type === 'expense' ? 'expense' : 'income';
                    
                    div.innerHTML = `
                        <div class="history-info">
                            <div class="history-cat">${item.category}</div>
                            <div class="history-comm">${item.comment || ''}</div>
                        </div>
                        <div class="history-right">
                            <div class="history-amount ${cls}">${sign}${item.amount} ₽</div>
                            <button class="del-btn" onclick="deleteItem(${item.id})">🗑</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = 'Ошибка загрузки истории';
            }
        }

        async function deleteItem(id) {
            if (!confirm("Удалить эту операцию?")) return;
            await fetch(`/api/transaction/delete?id=${id}&initData=${encodeURIComponent(tg.initData)}`, { method: 'DELETE' });
            loadHistory();
        }

        async function loadStats() {
            try {
                const res = await fetch(`/api/stats?initData=${encodeURIComponent(tg.initData)}`);
                const data = await res.json();

                const ctx = document.getElementById('expenseChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();

                chartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(data.expenses),
                        datasets: [{
                            data: Object.values(data.expenses),
                            backgroundColor: ['#ff6384', '#36a2eb', '#cc65fe', '#ffce56', '#4bc0c0', '#9966ff']
                        }]
                    },
                    options: { plugins: { legend: { labels: { color: '#ffffff' } } } }
                });

                document.getElementById('stats-summary').innerHTML = `
                    <div>🟢 Доходы: <b>${data.total_income} ₽</b></div>
                    <div>🔴 Расходы: <b>${data.total_expense} ₽</b></div>
                    <hr style="border-color: var(--border-color)">
                    <div>💰 Баланс: <b>${data.total_income - data.total_expense} ₽</b></div>
                `;
            } catch (e) {}
        }

        loadCategories();
    </script>
</body>
</html>
